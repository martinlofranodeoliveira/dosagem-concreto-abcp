[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dosagem-concreto-abcp"
version = "1.0.0"
description = "Dosagem experimental e analítica de concreto pelo Método ABCP/ACI (ABNT NBR 12655 e NBR 6118) em frações racionais e grandezas inteiras exatas sem float."
readme = "README.md"
authors = [
    { name = "Martin Lofrano de Oliveira", email = "martin@lofranotecnologia.com.br" }
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
dosagem-concreto = "dosagem_concreto_abcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
